name: Build BatchPlot for AutoCAD 2025

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore BatchPlotBP.csproj

      - name: Build
        run: dotnet build BatchPlotBP.csproj -c Release --no-restore

      - name: Upload DLL
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BatchPlotBP-DLL
          path: bin/Release/**/*.dll
